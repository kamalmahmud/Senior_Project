[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ivthermal"
version = "0.1.0"
description = "Thermal video classification baseline (TSM-MobileNetV2)"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "torchvision",
  "numpy",
  "pyyaml",
  "pydantic>=2.0",
  "tqdm",
  "opencv-python",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ivthermal*"]
